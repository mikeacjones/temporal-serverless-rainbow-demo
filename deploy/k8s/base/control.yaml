# The control plane: the rollout coordinator and the traffic generator.
#
# Unversioned on purpose — a Workflow that changes which version takes traffic
# must not be pinned to one of those versions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control
  labels: { app: control }
spec:
  replicas: 1
  selector:
    matchLabels: { app: control }
  template:
    metadata:
      labels: { app: control }
    spec:
      securityContext:
        runAsNonRoot: true
        # Distroless images declare the user by name ("nonroot"), which kubelet
        # cannot check against runAsNonRoot — it needs a number. 65532 is the
        # UID behind that name.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control
          image: rainbow-control
          envFrom:
            - configMapRef: { name: temporal }
          env:
            - name: TEMPORAL_API_KEY
              valueFrom:
                secretKeyRef: { name: temporal, key: api-key, optional: true }
            - { name: LOG_FORMAT, value: json }
          # A spike is 500 concurrent StartWorkflowExecution calls per batch
          # Activity, each one a TLS gRPC round trip. At a 100m request this
          # pod is scheduled 0.1 of a core, so under node contention the
          # batch slowed past its heartbeat timeout and orders were dropped
          # client-side while the server was answering starts in 14ms.
          #
          # No CPU limit on purpose: bursting is exactly what this pod does,
          # and a limit would reintroduce the throttling by another route.
          resources:
            requests: { cpu: 500m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
