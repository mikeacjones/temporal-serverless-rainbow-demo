# Serves the dashboard and proxies the API to the backend, so the browser sees
# a single origin and needs no CORS.

server {
  # Port 8080 rather than 80: the container runs unprivileged.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The console is one page; anything unrecognised is still the console.
  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The live stream needs buffering off, or snapshots arrive in clumps —
  # and a long read timeout, or the connection is cut every minute.
  location /events {
    proxy_pass http://backend:8080/events;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
